name: CI
# Gitea-primary lint CI (3 ecosystem gates). Build + unit tests stay LOCAL-ONLY (need Lidarr host
# assemblies). The runner image has no pwsh, and the catthehacker container both can't be pulled on
# this host ("No such image") and can't reach Gitea for in-container checkout (the #12 blocker). So
# run on the bare runner (which reaches Gitea + has dotnet) and install PowerShell from the
# self-contained release tarball — same proven pattern as Common/brainarr/tidalarr/amazonmusicarr.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install PowerShell
        shell: bash
        run: |
          set -e
          curl -sSL https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/powershell-7.4.6-linux-x64.tar.gz -o /tmp/pwsh.tgz
          mkdir -p /opt/pwsh
          tar -xzf /tmp/pwsh.tgz -C /opt/pwsh
          chmod +x /opt/pwsh/pwsh
          echo "/opt/pwsh" >> "$GITHUB_PATH"
      - name: Date-parsing gate
        shell: pwsh
        run: ./ext/Lidarr.Plugin.Common/scripts/lint-date-parsing.ps1 -Path . -Mode ci
      - name: Sync-over-async gate
        shell: pwsh
        run: ./ext/Lidarr.Plugin.Common/scripts/lint-sync-over-async.ps1 -Path . -Mode ci
      - name: Ecosystem parity gate
        shell: pwsh
        run: ./ext/Lidarr.Plugin.Common/scripts/ecosystem-parity-lint.ps1 -RepoPath . -CommonRoot ext/Lidarr.Plugin.Common -Mode ci
