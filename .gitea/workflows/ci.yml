name: CI
on: [workflow_dispatch, push]
jobs:
  diag:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:full-latest
    steps:
      - name: probe
        shell: bash
        run: |
          set +e
          R=diag.txt; : > "$R"
          echo "## tooling" >> "$R"
          node --version  >> "$R" 2>&1; echo "node rc=$?"  >> "$R"
          git  --version  >> "$R" 2>&1; echo "git rc=$?"   >> "$R"
          (command -v pwsh && pwsh --version) >> "$R" 2>&1; echo "pwsh rc=$?" >> "$R"
          echo "## net->gitea" >> "$R"
          curl -sS -m 10 -o /dev/null -w "gitea_http=%{http_code}\n" "http://192.168.2.59:3001/RicherTunes/Lidarr.Plugin.Common.git/info/refs?service=git-upload-pack" >> "$R" 2>&1
          echo "curl rc=$?" >> "$R"
          echo "## submodule clone" >> "$R"
          git clone --depth=1 "http://192.168.2.59:3001/RicherTunes/Lidarr.Plugin.Common.git" /tmp/ct >> "$R" 2>&1
          echo "clone rc=$?" >> "$R"
          ls /tmp/ct/scripts/lint-date-parsing.ps1 >> "$R" 2>&1; echo "ls rc=$?" >> "$R"
          echo "## done"; cat "$R"
      - name: upload
        uses: actions/upload-artifact@v3
        with:
          name: diag
          path: diag.txt
