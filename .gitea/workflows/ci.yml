name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: ls ext/Lidarr.Plugin.Common/scripts/lint-date-parsing.ps1 && echo CHECKOUT_OK
      - name: pwsh check
        shell: pwsh
        run: $PSVersionTable.PSVersion; Write-Host PWSH_OK
