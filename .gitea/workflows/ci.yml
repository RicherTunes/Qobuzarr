name: CI
# Gitea-primary lint CI. The default act_runner image lacks Node (for actions/checkout@v4) and
# PowerShell (for the .ps1 gates), so the job pins a container that has Node20+git and installs pwsh.
# Build + unit tests stay LOCAL-ONLY (need Lidarr host assemblies). See memory: gitea-primary-host.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest
    steps:
      - name: Mark workspace safe for git
        shell: bash
        run: git config --global --add safe.directory '*'
      - name: Checkout (no submodules; token is repo-scoped)
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Init Common submodule (anonymous HTTP, public repo)
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync -- ext/Lidarr.Plugin.Common
          git submodule update --init --depth=1 -- ext/Lidarr.Plugin.Common
          test -d ext/Lidarr.Plugin.Common/scripts || { echo "::error::Common submodule not initialized"; exit 1; }
      - name: Install PowerShell
        shell: bash
        run: |
          set -euo pipefail
          if command -v pwsh >/dev/null 2>&1; then echo "pwsh present"; exit 0; fi
          apt-get update
          apt-get install -y --no-install-recommends wget ca-certificates
          . /etc/os-release
          wget -q "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb"
          dpkg -i packages-microsoft-prod.deb && rm packages-microsoft-prod.deb
          apt-get update && apt-get install -y --no-install-recommends powershell
          pwsh --version
      - name: Date-parsing gate
        shell: pwsh
        run: ./ext/Lidarr.Plugin.Common/scripts/lint-date-parsing.ps1 -Path . -Mode ci
      - name: Sync-over-async gate
        shell: pwsh
        run: ./ext/Lidarr.Plugin.Common/scripts/lint-sync-over-async.ps1 -Path . -Mode ci
      - name: Ecosystem parity gate
        shell: pwsh
        run: ./ext/Lidarr.Plugin.Common/scripts/ecosystem-parity-lint.ps1 -RepoPath . -CommonRoot ext/Lidarr.Plugin.Common -Mode ci
