name: CI
on: [workflow_dispatch, push]
jobs:
  diag:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:full-latest
      options: --network=host
    steps:
      - name: probe
        shell: bash
        run: |
          set +e
          R=diag.txt; : > "$R"
          echo "## net->gitea (curl, 10s)" >> "$R"
          curl -sS -m 10 -o /dev/null -w "gitea_http=%{http_code}\n" "http://192.168.2.59:3001/RicherTunes/Lidarr.Plugin.Common.git/info/refs?service=git-upload-pack" >> "$R" 2>&1
          echo "curl rc=$?" >> "$R"
          echo "## submodule clone (timeout 25s)" >> "$R"
          timeout 25 git clone --depth=1 "http://192.168.2.59:3001/RicherTunes/Lidarr.Plugin.Common.git" /tmp/ct >> "$R" 2>&1
          echo "clone rc=$? (124=timeout)" >> "$R"
          ls /tmp/ct/scripts/lint-date-parsing.ps1 >> "$R" 2>&1; echo "ls rc=$?" >> "$R"
          echo "## ip/route" >> "$R"
          ip addr 2>/dev/null | grep -E "inet " >> "$R"; ip route 2>/dev/null | head -3 >> "$R"
          cat "$R"
      - name: upload
        uses: actions/upload-artifact@v3
        with: { name: diag, path: diag.txt }
